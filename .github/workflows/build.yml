name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git describe

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build
        run: make -j4 VERSION="$VERSION"

      - name: Unit + network tests
        run: make test

      - name: Installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $game = Join-Path $env:RUNNER_TEMP "GMA Wonderlands"
          New-Item -ItemType Directory $game | Out-Null
          Set-Content "$game\zlib.dll" "original zlib"
          Set-Content "$game\gma_wonderlands.exe" "stand-in"
          $setup = "build\GMA-Multiplayer-Setup.exe"
          function Run([string[]]$a) { (Start-Process $setup -ArgumentList $a -Wait -PassThru -NoNewWindow).ExitCode }
          if ((Run "--status", "--dir", "`"$game`"") -ne 3) { throw "status before install should be 'not installed'" }
          if ((Run "--install", "--dir", "`"$game`"") -ne 0) { throw "install failed" }
          if ((Run "--status", "--dir", "`"$game`"") -ne 0) { throw "status after install should be 'installed'" }
          if ((Get-Content "$game\zlib_orig.dll") -ne "original zlib") { throw "original zlib.dll was not backed up" }
          if ((Get-FileHash "$game\zlib.dll").Hash -ne (Get-FileHash "build\obj\zlib.dll").Hash) { throw "mod dll not installed" }
          if (Test-Path "$game\gma_mp.ini") { throw "installer should not write settings" }
          Set-Content "$game\gma_mp.ini" "mode = host"   # as the mod writes it on first launch
          if ((Run "--uninstall", "--dir", "`"$game`"") -ne 0) { throw "uninstall failed" }
          if ((Get-Content "$game\zlib.dll") -ne "original zlib") { throw "original zlib.dll was not restored" }
          if (Test-Path "$game\zlib_orig.dll") { throw "backup left behind" }
          if (Test-Path "$game\gma_mp.ini") { throw "settings file left behind" }
          Write-Host "installer smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: GMA-Multiplayer-${{ env.VERSION }}
          path: build/GMA-Multiplayer-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GMA-Multiplayer-Setup.exe
          generate_release_notes: true
